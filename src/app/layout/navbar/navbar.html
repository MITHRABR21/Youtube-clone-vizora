<header class="navbar">
  <div class="nav-start">
    <button type="button" class="menu-btn" (click)="toggleSidebar()" title="Toggle navigation">
      <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <a routerLink="/" class="brand-logo" (click)="clearSearch()">
      <span class="logo-play-badge">▶</span>
      <span class="logo-text">VIZORA</span>
      <span class="region-badge">IN</span>
    </a>
  </div>

  <div class="nav-center">
    <form class="search-form" (ngSubmit)="onSearch()">
      <div class="search-input-wrapper">
        <input 
          type="text" 
          name="searchField"
          placeholder="Search" 
          [(ngModel)]="searchQuery" 
        />
        @if (searchQuery) {
          <button type="button" class="clear-input-btn" (click)="clearSearch()">✕</button>
        }
      </div>
      <button type="submit" class="search-btn" title="Search">
        <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </form>
  </div>

  <div class="nav-end">
    <button type="button" class="create-btn" routerLink="/studio">
      <span class="plus-icon">+</span>
      <span>Create</span>
    </button>
    <div class="user-avatar-pill">M</div>
  </div>
</header>
