<aside class="sidebar" [class.collapsed]="!uiService.isSidebarOpen()">
  <!-- Main Nav -->
  <nav class="sidebar-section">
    <a href="/" class="nav-item active">
      <svg class="item-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span class="label">Home</span>
    </a>
    <a href="/shorts" class="nav-item">
      <svg class="item-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33-1.2-1.2-1.42 1.41 1.2 1.2c.46.47.75 1.1.75 1.77 0 .68-.29 1.3-.75 1.77l-1.2 1.2 1.42 1.41 1.2-1.2C18.66 14.77 19.2 13.43 19.2 12s-.54-2.77-1.43-3.68zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      <span class="label">Shorts</span>
    </a>
    <a href="/" class="nav-item">
      <svg class="item-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
      <span class="label">Subscriptions</span>
    </a>
  </nav>

  @if (uiService.isSidebarOpen()) {
    <div class="section-divider"></div>

    <!-- Subscriptions Shelf -->
    <nav class="sidebar-section">
      <div class="section-title">Subscriptions ›</div>
      <a href="/channel/Sun%20TV%20Official" class="nav-item channel-item">
        <img src="https://api.dicebear.com/7.x/identicon/svg?seed=SunTV" class="sub-avatar" alt="Sun TV" />
        <span class="label">Sun TV Official</span>
      </a>
      <a href="/channel/Vijay%20Television" class="nav-item channel-item">
        <img src="https://api.dicebear.com/7.x/identicon/svg?seed=VijayTV" class="sub-avatar" alt="Vijay TV" />
        <span class="label">Vijay Television</span>
      </a>
      <a href="/channel/Sothanaigal" class="nav-item channel-item">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Sothanaigal" class="sub-avatar" alt="Sothanaigal" />
        <span class="label">Sothanaigal</span>
      </a>
      <a href="/channel/T-Series" class="nav-item channel-item">
        <img src="https://api.dicebear.com/7.x/identicon/svg?seed=TSeries" class="sub-avatar" alt="T-Series" />
        <span class="label">T-Series</span>
      </a>
      <a href="/channel/WB%20Kids" class="nav-item channel-item">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=WBKids" class="sub-avatar" alt="WB Kids" />
        <span class="label">WB Kids</span>
      </a>
    </nav>

    <div class="section-divider"></div>

    <!-- User Library Section -->
    <nav class="sidebar-section">
      <div class="section-title">You ›</div>
      <a href="/feed/history" class="nav-item">
        <svg class="item-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        <span class="label">History</span>
      </a>
      <a href="/playlist?list=WL" class="nav-item">
        <svg class="item-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        <span class="label">Watch later</span>
      </a>
      <a href="/playlist?list=LL" class="nav-item">
        <svg class="item-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
        <span class="label">Liked videos</span>
      </a>
    </nav>
  }
</aside>
